name: Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-26
            formats: app,dmg
          - os: windows-latest
            formats: nsis,wix

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cinder
        run: cargo install --git https://github.com/CapSoftware/cinder --rev 2a96b0551fd7bf1ae6e4115a74bfd33b078bb58a --locked cinder

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxdo-dev \
            libxkbcommon-x11-dev \
            libayatana-appindicator3-dev \
            libzstd-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-gpui
            crates/lopload-native
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run scripts/set-version.mjs

      - name: Package GPUI application
        working-directory: src-gpui
        run: cargo-packager --config packager.toml --formats ${{ matrix.formats }}

      - name: Create and sign macOS updater bundle
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        working-directory: src-gpui
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
          ARCHIVE="target/release/packages/Lopload_${VERSION}_darwin-${ARCH}.app.zip"
          ditto -c -k --keepParent target/release/packages/Lopload.app "$ARCHIVE"
          cargo-packager signer sign "$ARCHIVE"

      - name: Sign Linux updater artifact
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        working-directory: src-gpui
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARTIFACT="$(find target/release/packages -type f -name '*.AppImage' -print -quit)"
          test -n "$ARTIFACT"
          cargo-packager signer sign "$ARTIFACT"

      - name: Sign Windows updater artifact
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        working-directory: src-gpui
        shell: pwsh
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $artifact = Get-ChildItem target/release/packages -Recurse -File -Filter *-setup.exe | Select-Object -First 1
          if (-not $artifact) { throw "NSIS updater artifact not found" }
          cargo-packager signer sign $artifact.FullName

      - name: Copy raw binary (Windows portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item src-gpui/target/release/lopload.exe src-gpui/target/release/packages/Lopload_portable.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: src-gpui/target/release/packages/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true

      - name: Build updater manifest
        run: bun run .github/scripts/build-latest-json.mjs

      - name: Determine if this is a prerelease
        id: prerelease
        run: echo "value=${{ contains(github.ref_name, '-') }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: |
            **/*.deb
            **/*.AppImage
            **/*.AppImage.sig
            **/*.dmg
            **/*.app.zip
            **/*.app.zip.sig
            **/*.msi
            **/*.exe
            **/*.exe.sig
            latest.json
          generate_release_notes: true
