name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets build.yml run these same jobs as a gate before tag releases.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, the pure unit tests, and the scenario suite — the last of which
  # drives the real app against a real MinIO. `ensureMinio()` starts the
  # container itself (docker is preinstalled on the runner), so there's no
  # service block here; that keeps the local and CI paths identical.
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

  # Never ran in CI before this: the Rust half of the app — the tray status
  # line, positional file writes (fastfs), and the upload fast path's header
  # parsing and cancel registry (fasthttp) — was covered only by whatever a
  # developer happened to run locally.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cinder
        run: cargo install --git https://github.com/CapSoftware/cinder --rev 2a96b0551fd7bf1ae6e4115a74bfd33b078bb58a --locked cinder

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/lopload-native

      - name: Cinder native tests
        working-directory: crates/lopload-native
        run: cinder test

      - name: Start native S3 test storage
        run: |
          docker run -d --name lopload-native-minio -p 9400:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:9400/minio/health/live && break
            sleep 1
          done
          curl --fail http://127.0.0.1:9400/minio/health/live

      - name: Cinder native S3 integration
        working-directory: crates/lopload-native
        run: |
          cinder test lists_real_minio_objects -- --ignored
          cinder test uploads_and_downloads_real_minio_bytes -- --ignored
          cinder test moves_real_minio_objects_without_downloading_them -- --ignored
          cinder test trashes_restores_and_permanently_deletes_real_minio_folders -- --ignored

      - name: Cinder test
        working-directory: src-tauri
        run: cinder test

  gpui:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cinder
        run: cargo install --git https://github.com/CapSoftware/cinder --rev 2a96b0551fd7bf1ae6e4115a74bfd33b078bb58a --locked cinder

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-gpui

      - name: Cinder check and test
        working-directory: src-gpui
        run: |
          cinder check
          cinder test
