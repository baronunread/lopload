name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev

      - name: Install Cinder
        run: cargo install --git https://github.com/CapSoftware/cinder --rev 2a96b0551fd7bf1ae6e4115a74bfd33b078bb58a --locked cinder

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lopload-native

      - name: Native tests
        working-directory: crates/lopload-native
        run: cinder test

      - name: Start native S3 test storage
        run: |
          docker run -d --name lopload-native-minio -p 9400:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:9400/minio/health/live && break
            sleep 1
          done
          curl --fail http://127.0.0.1:9400/minio/health/live

      - name: Native S3 integration
        working-directory: crates/lopload-native
        run: |
          cinder test lists_real_minio_objects -- --ignored
          cinder test uploads_and_downloads_real_minio_bytes -- --ignored
          cinder test moves_real_minio_objects_without_downloading_them -- --ignored
          cinder test trashes_restores_and_permanently_deletes_real_minio_folders -- --ignored

  gpui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cinder
        run: cargo install --git https://github.com/CapSoftware/cinder --rev 2a96b0551fd7bf1ae6e4115a74bfd33b078bb58a --locked cinder

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxdo-dev \
            libxkbcommon-x11-dev \
            libayatana-appindicator3-dev \
            libzstd-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-gpui
            crates/lopload-native

      - name: GPUI check and tests
        working-directory: src-gpui
        run: |
          cinder check --locked
          cinder test --locked
